<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Validation de commande | MEMORA</title>
<link rel="stylesheet" href="style.css">
</head>
<body data-page="checkout">
<header>
  <div class="container nav">
    <a class="logo" href="index.html">MEM<span>O</span>RA</a>
    <button class="menu-btn" aria-label="Ouvrir le menu" aria-expanded="false">☰</button>
    <ul class="nav-links">
      <li><a href="index.html">Accueil</a></li>
      <li><a href="produits.html">Cadeaux</a></li>
      <li><a href="a-propos.html">À propos</a></li>
      <li><a href="contact.html">Contact</a></li>
      <li><a href="panier.html">Panier (<span id="cart-count">0</span>)</a></li>
      <li><a href="login.html" id="nav-account">Connexion</a></li>
      <li id="nav-admin" hidden><a href="admin.html">Admin</a></li>
    </ul>
  </div>
</header>
<main>
<section class="page-hero">
  <div class="container">
    <div class="breadcrumb">Accueil → Commande</div>
    <h1>Valider la commande</h1>
    <p class="lead">Paiement simulé : aucun débit et aucune donnée bancaire réelle.</p>
  </div>
</section>
<section>
  <div class="container">
    <div id="checkoutFlash" class="flash" hidden></div>
    <form id="checkoutForm" class="checkout-grid">
      <div class="card">
        <h3>Livraison</h3>
        <label for="custName">Prénom et nom</label>
        <input id="custName" type="text" required minlength="2">
        <label for="custPhone">Téléphone</label>
        <input id="custPhone" type="tel" required minlength="8">
        <label for="custAddress">Adresse</label>
        <input id="custAddress" type="text" required minlength="4">
        <label for="custCity">Ville</label>
        <input id="custCity" type="text" required minlength="2">
        <h3 style="margin-top:18px">Paiement simulé</h3>
        <label><input type="radio" name="payment" value="carte_fictive" checked> Carte fictive</label>
        <label><input type="radio" name="payment" value="livraison"> Paiement à la livraison (démo)</label>
      </div>
      <div class="card">
        <h3>Résumé</h3>
        <div id="checkout-summary"></div>
        <button class="btn" type="submit">Simuler le paiement et enregistrer</button>
      </div>
    </form>
  </div>
</section>
</main>
<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script defer src="supabase-client.js"></script>
<script defer src="supabase-shop.js"></script>
<script defer src="script.js"></script>
</body>
</html>
